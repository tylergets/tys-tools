[package]
name = "ty-common"
description = "Shared plumbing for the ty* desktop tools: tray applet, single-instance lock, config discovery, notifications, and the X11/Wayland display layer."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
download = ["dep:sha2", "dep:ureq"]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
clap.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2 = { workspace = true, optional = true }
ureq = { workspace = true, optional = true, features = ["rustls"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev.workspace = true
gtk.workspace = true
gtk-layer-shell.workspace = true
libappindicator.workspace = true
libc.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
x11rb = { workspace = true, features = ["randr", "record", "shm", "xtest"] }
xkbcommon = { workspace = true, features = ["wayland"] }
