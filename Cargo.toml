[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.11.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tylergets/tys-tools"

[workspace.dependencies]
ty-common = { path = "crates/ty-common" }
anyhow = "=1.0.104"
base64 = "=0.22.1"
async-channel = "=2.5.0"
chrono = "=0.4.45"
clap = { version = "=4.6.7", features = ["derive"] }
dbus = "=0.9.12"
dirs = "=6.0.0"
emojis = "=0.7.2"
evdev = "=0.13.2"
gtk = "=0.18.2"
gtk-layer-shell = { version = "=0.8.2", features = ["v0_6"] }
input = "=0.10.0"
libappindicator = "=0.9.0"
libc = "=0.2.191"
pangocairo = "=0.18.0"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.10.9"
transcribe-cpp = { version = "=0.4.1", default-features = false }
ureq = { version = "=3.5.1", default-features = false }
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
x11rb = "=0.13.2"
xkbcommon = { version = "=0.7.0", default-features = false }

[profile.release]
lto = "thin"
