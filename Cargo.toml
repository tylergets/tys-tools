[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tylergets/tys-tools"

[workspace.dependencies]
ty-common = { path = "crates/ty-common" }
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dbus = "0.9"
dirs = "6"
emojis = "0.7"
enigo = "0.2"
evdev = "0.13"
gtk = "0.18.2"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
hound = "3.5"
libappindicator = "0.9.0"
libc = "0.2"
rdev = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
transcribe-cpp = { version = "=0.4.1", default-features = false }
ureq = { version = "3", default-features = false }
x11rb = "0.13"
xkbcommon = { version = "0.7", default-features = false }

[profile.release]
lto = "thin"
